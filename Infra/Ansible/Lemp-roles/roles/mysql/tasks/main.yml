  
# installing mysql-server

  - name: "Installing mysql"
    ansible.builtin.apt:
      name: "mysql-server"
      state: "latest"
      update_cache: true

  - name: "Installing pymysql"
    ansible.builtin.apt:
      name: "python3-pymysql"
      state: "latest"
      update_cache: true

  - name: "Set up root password"
    ansible.mysql.mysql_user:
      name: "root"
      password: "password"
      login_user: "root"
      login_password: "password"
      check_implicit_admin: true
      login_unix_socket: "/var/run/mysqld/mysqld.sock"

  - name: "Remove anon users"
    ansible.mysql.mysql_user:
      name: ""
      state: "absent"
      login_user: "root"
      login_password: "password"


  - name: "Remove test db"
    ansible.mysql.mysql_db:
      name: "test"
      state: "absent"
      login_user: "root"
      login_password: "password"
